add_newline = false

format = """$username$directory$singularity$kubernetes$nats$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure($direnv)$env_var$mise$crystal$custom$sudo$cmd_duration$jobs$battery$time$status$container$netns$os$shell$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'
